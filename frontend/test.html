<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeedAI 前端测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
        .success { color: green; }
        .error { color: red; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>🌱 SeedAI 前端集成测试</h1>

    <div class="test-section">
        <h2>1. 后端连接测试</h2>
        <button onclick="testBackendConnection()">测试后端连接</button>
        <div id="backendResult"></div>
    </div>

    <div class="test-section">
        <h2>2. 页面导航测试</h2>
        <button onclick="testPageNavigation('index.html')">测试首页</button>
        <button onclick="testPageNavigation('login.html')">测试登录页</button>
        <button onclick="testPageNavigation('dataset.html')">测试数据集页</button>
        <button onclick="testPageNavigation('annotate.html')">测试标注页</button>
        <div id="navigationResult"></div>
    </div>

    <div class="test-section">
        <h2>3. API 功能测试</h2>
        <button onclick="testAPIFunctions()">测试API功能</button>
        <div id="apiResult"></div>
    </div>

    <div class="test-section">
        <h2>4. 样式和响应式测试</h2>
        <p>检查页面在不同屏幕尺寸下的显示效果</p>
        <button onclick="testResponsive()">测试响应式</button>
        <div id="responsiveResult"></div>
    </div>

    <script>
        async function testBackendConnection() {
            const result = document.getElementById('backendResult');
            result.innerHTML = '测试中...';

            try {
                const response = await fetch('http://localhost:5000/health');
                if (response.ok) {
                    const data = await response.json();
                    result.innerHTML = '<span class="success">✅ 后端连接正常: ' + JSON.stringify(data) + '</span>';
                } else {
                    result.innerHTML = '<span class="error">❌ 后端响应异常: ' + response.status + '</span>';
                }
            } catch (error) {
                result.innerHTML = '<span class="error">❌ 连接失败: ' + error.message + '</span>';
            }
        }

        function testPageNavigation(page) {
            const result = document.getElementById('navigationResult');
            result.innerHTML = '正在打开 ' + page + '...';
            window.open(page, '_blank');
            result.innerHTML = '<span class="success">✅ 已打开 ' + page + ' 页面</span>';
        }

        async function testAPIFunctions() {
            const result = document.getElementById('apiResult');
            result.innerHTML = '测试中...';

            try {
                // 测试公开数据集API
                const response = await fetch('http://localhost:5000/api/datasets/public');
                if (response.ok) {
                    result.innerHTML = '<span class="success">✅ API功能正常</span>';
                } else {
                    result.innerHTML = '<span class="error">❌ API测试失败: ' + response.status + '</span>';
                }
            } catch (error) {
                result.innerHTML = '<span class="error">❌ API连接失败: ' + error.message + '</span>';
            }
        }

        function testResponsive() {
            const result = document.getElementById('responsiveResult');
            const width = window.innerWidth;
            const height = window.innerHeight;

            result.innerHTML = `
                <span class="success">
                    ✅ 当前屏幕尺寸: ${width} x ${height}px<br>
                    ${width < 768 ? '📱 移动端布局' : width < 1024 ? '📟 平板布局' : '💻 桌面布局'}
                </span>
            `;
        }

        // 自动运行一些基础测试
        window.addEventListener('load', () => {
            setTimeout(() => {
                testBackendConnection();
                testResponsive();
            }, 1000);
        });
    </script>
</body>
</html>
