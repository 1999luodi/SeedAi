<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据集管理 - SeedAI</title>
    <link rel="stylesheet" href="style.css?v=20260309ai">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <h1>🌱 SeedAI</h1>
                    <span class="subtitle">AI图像标注平台</span>
                </div>
                <nav class="nav">
                    <ul>
                        <li><a href="index.html">首页</a></li>
                        <li><a href="spectrum.html">光谱分析</a></li>
                        <li><a href="detection.html">AI检测</a></li>
                        <li><a href="dataset.html" class="active">数据集</a></li>
                        <li><a href="annotate.html">手工标注</a></li>
                        <li><a href="javascript:void(0)" id="profileLink" style="display:none;">
                            <span id="usernameDisplay"></span>
                            <span id="logoutLink" style="cursor:pointer;margin-left:10px;">退出</span>
                        </a></li>
                        <li><a href="login.html" id="loginLink">登录</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <section class="dm-header">
                <div>
                    <h2>数据集管理</h2>
                    <p>创建数据集、上传文件、进入标注流程。</p>
                </div>
                <button id="dmCreateBtn" class="btn btn-primary">创建数据集</button>
            </section>

            <section id="dmListView" class="dm-list-view">
                <div id="dmDatasetCards" class="dm-cards"></div>
            </section>

            <section id="dmDetailView" class="dm-detail-view" style="display:none;">
                <div class="dm-detail-top">
                    <div>
                        <h3 id="dmDatasetTitle">数据集</h3>
                        <p id="dmDatasetMeta">-</p>
                    </div>
                    <div class="dm-toolbar">
                        <button id="dmUploadBtn" class="btn btn-secondary">上传文件</button>
                        <button id="dmGoAnnotateBtn" class="btn btn-primary">标注数据</button>
                        <button id="dmBackBtn" class="btn btn-secondary">返回列表</button>
                    </div>
                </div>

                <div class="dm-detail-grid">
                    <div class="dm-files-panel">
                        <h4>数据文件</h4>
                        <div id="dmFileList" class="dm-scroll"></div>
                    </div>
                    <div class="dm-anno-panel">
                        <h4>标注数据</h4>
                        <div id="dmAnnoSummary" class="dm-scroll"></div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <div id="dmCreateModal" class="modal" style="display:none;">
        <div class="modal-content dm-modal">
            <div class="modal-header">
                <h3>创建数据集</h3>
                <button id="dmCloseCreate" class="modal-close" type="button">&times;</button>
            </div>
            <div class="modal-body">
                <form id="dmCreateForm">
                    <div class="form-group">
                        <label for="dmName">数据集名</label>
                        <input id="dmName" type="text" required>
                    </div>
                    <div class="form-group">
                        <label for="dmDesc">描述</label>
                        <textarea id="dmDesc"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="dmType">类型</label>
                        <select id="dmType">
                            <option value="classification">分类</option>
                            <option value="detection" selected>检测</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">创建</button>
                        <button id="dmCancelCreate" type="button" class="btn btn-secondary">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="dmUploadModal" class="modal" style="display:none;">
        <div class="modal-content dm-modal dm-upload-modal">
            <div class="modal-header">
                <h3>上传文件</h3>
                <button id="dmCloseUpload" class="modal-close" type="button">&times;</button>
            </div>
            <div class="modal-body">
                <p class="dm-note">支持拖拽多文件，或从本地目录选择。单次最多1000个文件。</p>
                <div id="dmDropZone" class="dm-drop-zone">
                    <p>拖动文件到此区域</p>
                    <p>或使用下方按钮选择</p>
                </div>
                <div class="dm-upload-actions">
                    <button id="dmPickFilesBtn" class="btn btn-secondary" type="button">选择文件</button>
                    <button id="dmPickFolderBtn" class="btn btn-secondary" type="button">选择目录</button>
                    <button id="dmStartUploadBtn" class="btn btn-primary" type="button">开始上传</button>
                </div>
                <input id="dmFileInput" type="file" multiple style="display:none;">
                <input id="dmFolderInput" type="file" webkitdirectory directory multiple style="display:none;">
                <div id="dmUploadList" class="dm-upload-list"></div>
            </div>
        </div>
    </div>

    <script src="js/api-contract.js?v=20260308d"></script>
    <script src="js/shared.js?v=20260308d"></script>
    <script src="js/dataset.js?v=20260309b"></script>
</body>
</html>
