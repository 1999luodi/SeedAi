<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - SeedAI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <h1>🌱 SeedAI</h1>
                    <span class="subtitle">AI图像标注平台</span>
                </div>
                <nav class="nav">
                    <ul>
                        <li><a href="index.html">首页</a></li>
                        <li><a href="spectrum.html">光谱分析</a></li>
                        <li><a href="detection.html">AI检测</a></li>
                        <li><a href="dataset.html">数据集</a></li>
                        <li><a href="annotate.html">手工标注</a></li>
                        <li><a href="javascript:void(0)" id="profileLink" style="display:none;">
                            <span id="usernameDisplay"></span>
                            <span id="logoutLink" style="cursor:pointer;margin-left:10px;">退出</span>
                        </a></li>
                        <li><a href="login.html" class="active">登录/注册</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <h2 id="authTitle">欢迎回来</h2>
                    <p id="authSubtitle">登录您的SeedAI账户</p>
                </div>

                <!-- 登录表单 -->
                <form id="loginForm" class="auth-form active-form">
                    <div class="form-group">
                        <label for="loginUsername">用户名或邮箱</label>
                        <input
                            type="text"
                            id="loginUsername"
                            placeholder="输入用户名或邮箱"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">密码</label>
                        <div class="password-input">
                            <input
                                type="password"
                                id="loginPassword"
                                placeholder="输入密码"
                                required
                            >
                            <button type="button" class="password-toggle" id="loginPasswordToggle">
                                👁️
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox">
                            <input type="checkbox" id="rememberMe">
                            <span class="checkmark"></span>
                            记住我
                        </label>
                        <a href="#" class="forgot-password">忘记密码？</a>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
                        <span class="btn-icon">🔓</span>
                        登录
                    </button>
                </form>

                <!-- 注册表单 -->
                <form id="registerForm" class="auth-form" style="display: none;">
                    <div class="form-group">
                        <label for="regUsername">用户名</label>
                        <input
                            type="text"
                            id="regUsername"
                            placeholder="输入用户名（3-20字符）"
                            required
                            minlength="3"
                            maxlength="20"
                        >
                    </div>
                    <div class="form-group">
                        <label for="regEmail">邮箱</label>
                        <input
                            type="email"
                            id="regEmail"
                            placeholder="输入邮箱地址"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="regPassword">密码</label>
                        <div class="password-input">
                            <input
                                type="password"
                                id="regPassword"
                                placeholder="输入密码（至少6位）"
                                required
                                minlength="6"
                            >
                            <button type="button" class="password-toggle" id="regPasswordToggle">
                                👁️
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="regConfirmPassword">确认密码</label>
                        <div class="password-input">
                            <input
                                type="password"
                                id="regConfirmPassword"
                                placeholder="再次输入密码"
                                required
                            >
                            <button type="button" class="password-toggle" id="regConfirmPasswordToggle">
                                👁️
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full" id="registerBtn">
                        <span class="btn-icon">✓</span>
                        注册
                    </button>
                </form>

                <div class="auth-divider">
                    <span>或</span>
                </div>

                <div class="auth-links">
                    <p id="switchFormText">还没有账户？<a href="#" id="switchToRegister">立即注册</a></p>
                </div>

                <div class="auth-footer">
                    <p>使用即表示您同意我们的 <a href="#">服务条款</a> 和 <a href="#">隐私政策</a></p>
                </div>
            </div>

            <div class="auth-sidebar">
                <div class="auth-feature">
                    <div class="feature-icon">🎯</div>
                    <h3>发芽检测</h3>
                    <p>实时准确识别种子发芽情况</p>
                </div>
                <div class="auth-feature">
                    <div class="feature-icon">📊</div>
                    <h3>光谱分析</h3>
                    <p>分析种子活力和品质指标</p>
                </div>
                <div class="auth-feature">
                    <div class="feature-icon">📁</div>
                    <h3>数据管理</h3>
                    <p>组织和管理您的数据集</p>
                </div>
            </div>
        </div>
    </main>

    <script src="js/api-contract.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
