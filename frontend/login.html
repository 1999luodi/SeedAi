<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - SeedAI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <h1>🌱 SeedAI</h1>
                    <span class="subtitle">AI图像标注平台</span>
                </div>
                <nav class="nav">
                    <ul>
                        <li><a href="index.html">首页</a></li>
                        <li><a href="login.html" class="active">登录</a></li>
                        <li><a href="dataset.html">数据集</a></li>
                        <li><a href="annotate.html">标注</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <h2>欢迎回来</h2>
                    <p>登录您的SeedAI账户</p>
                </div>

                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="username">用户名或邮箱</label>
                        <input
                            type="text"
                            id="username"
                            placeholder="输入用户名或邮箱"
                            required
                            autocomplete="username"
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">密码</label>
                        <div class="password-input">
                            <input
                                type="password"
                                id="password"
                                placeholder="输入密码"
                                required
                                autocomplete="current-password"
                            >
                            <button type="button" class="password-toggle" id="passwordToggle">
                                👁️
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox">
                            <input type="checkbox" id="rememberMe">
                            <span class="checkmark"></span>
                            记住我
                        </label>
                        <a href="#" class="forgot-password">忘记密码？</a>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
                        <span class="btn-icon">🔓</span>
                        登录
                    </button>
                </form>

                <div class="auth-divider">
                    <span>或</span>
                </div>

                <div class="auth-links">
                    <p>还没有账户？<a href="#" id="registerLink">立即注册</a></p>
                </div>

                <div class="auth-footer">
                    <p>登录即表示您同意我们的 <a href="#">服务条款</a> 和 <a href="#">隐私政策</a></p>
                </div>
            </div>

            <div class="auth-sidebar">
                <div class="auth-feature">
                    <div class="feature-icon">🚀</div>
                    <h3>快速开始</h3>
                    <p>几秒钟内开始您的AI标注项目</p>
                </div>
                <div class="auth-feature">
                    <div class="feature-icon">🤖</div>
                    <h3>AI辅助</h3>
                    <p>智能识别和自动标注，节省80%时间</p>
                </div>
                <div class="auth-feature">
                    <div class="feature-icon">👥</div>
                    <h3>团队协作</h3>
                    <p>多人协作，实时同步标注进度</p>
                </div>
            </div>
        </div>
    </main>

    <!-- 注册模态框 -->
    <div class="modal" id="registerModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>创建账户</h3>
                <button class="modal-close" id="closeRegisterModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="registerForm">
                    <div class="form-group">
                        <label for="regUsername">用户名</label>
                        <input type="text" id="regUsername" placeholder="输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label for="regEmail">邮箱</label>
                        <input type="email" id="regEmail" placeholder="输入邮箱地址" required>
                    </div>
                    <div class="form-group">
                        <label for="regPassword">密码</label>
                        <input type="password" id="regPassword" placeholder="输入密码（至少6位）" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="regConfirmPassword">确认密码</label>
                        <input type="password" id="regConfirmPassword" placeholder="再次输入密码" required>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="cancelRegister">取消</button>
                        <button type="submit" class="btn btn-primary">注册</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
