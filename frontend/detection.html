<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI检测结果 - SeedAI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <h1>🌱 SeedAI</h1>
                    <span class="subtitle">AI图像标注平台</span>
                </div>
                <nav class="nav">
                    <ul>
                        <li><a href="index.html">首页</a></li>
                        <li><a href="spectrum.html">光谱分析</a></li>
                        <li><a href="detection.html" class="active">AI检测</a></li>
                        <li><a href="dataset.html">数据集</a></li>
                        <li><a href="annotate.html">手工标注</a></li>
                        <li><a href="javascript:void(0)" id="profileLink" style="display:none;">
                            <span id="usernameDisplay"></span>
                            <span id="logoutLink" style="cursor:pointer;margin-left:10px;">退出</span>
                        </a></li>
                        <li><a href="login.html" id="loginLink">登录</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="page-header">
                <h1>🤖 AI检测结果</h1>
                <p>使用YOLO模型自动检测图片中的种子发芽情况</p>
            </div>

            <div class="detection-controls">
                <div class="control-group">
                    <label for="datasetSelect">选择数据集:</label>
                    <select id="datasetSelect">
                        <option value="">-- 请选择数据集 --</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="imageSelect">选择图片:</label>
                    <select id="imageSelect">
                        <option value="">-- 请先选择数据集 --</option>
                    </select>
                </div>
                
                <button id="detectBtn" class="btn btn-primary" disabled>
                    <span class="btn-icon">🔍</span>
                    开始AI检测
                </button>
            </div>

            <div class="detection-workspace">
                <!-- 左侧检测结果面板 -->
                <div class="detection-panel">
                    <h3>检测结果</h3>
                    
                    <div class="detection-stats">
                        <div class="stat-item">
                            <span class="stat-label">检测目标数:</span>
                            <span class="stat-value" id="annotationCount">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">平均置信度:</span>
                            <span class="stat-value" id="avgConfidence">0%</span>
                        </div>
                    </div>
                    
                    <div class="detection-list" id="detectionList">
                        <p class="no-results">尚未进行检测</p>
                    </div>
                    
                    <div class="detection-actions">
                        <button id="exportResults" class="btn btn-secondary" disabled>
                            <span class="btn-icon">📤</span>
                            导出结果
                        </button>
                        <button id="saveResults" class="btn btn-primary" disabled>
                            <span class="btn-icon">💾</span>
                            保存标注
                        </button>
                    </div>
                </div>

                <!-- 右侧可视化区域 -->
                <div class="detection-visualization">
                    <div class="image-display">
                        <div class="image-placeholder" id="imagePlaceholder">
                            <div class="placeholder-content">
                                <span class="placeholder-icon">🖼️</span>
                                <p>请选择图片进行AI检测</p>
                            </div>
                        </div>
                        <canvas id="annotationCanvas" style="display: none;"></canvas>
                        <img id="currentImage" src="" alt="检测图像" style="display: none;">
                    </div>
                    
                    <div class="navigation-controls">
                        <button id="prevImage" class="btn btn-secondary" disabled>← 上一张</button>
                        <span id="imageCounter">0 / 0</span>
                        <button id="nextImage" class="btn btn-secondary" disabled>下一张 →</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // 检查用户登录状态
        function checkLoginStatus() {
            const token = localStorage.getItem('token');
            return !!token;
        }

        // 退出登录
        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'index.html';
        }

        // 初始化页面时检查登录状态
        document.addEventListener('DOMContentLoaded', function() {
            const isLoggedIn = checkLoginStatus();
            const loginLink = document.getElementById('loginLink');
            const profileLink = document.getElementById('profileLink');
            const logoutLink = document.getElementById('logoutLink');
            const usernameDisplay = document.getElementById('usernameDisplay');
            
            if (isLoggedIn) {
                // 用户已登录，显示用户名和退出链接
                loginLink.style.display = 'none';
                profileLink.style.display = 'block';
                
                // 获取用户信息并显示用户名
                fetch('/api/users/profile', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        usernameDisplay.textContent = data.data.username;
                    }
                })
                .catch(err => console.error('获取用户信息失败:', err));
                
                // 为退出登录链接添加事件监听器
                if (logoutLink) {
                    logoutLink.addEventListener('click', function(e) {
                        e.preventDefault();
                        logout();
                    });
                }
            } else {
                // 用户未登录，跳转到登录页面
                // 注意：这里我们不再跳转，而是显示登录链接
                loginLink.style.display = 'block';
                profileLink.style.display = 'none';
            }
            
            // 初始化页面组件
            initializeDetectionPage();
        });

        function initializeDetectionPage() {
            // 检测页面功能实现
            class DetectionPage {
            constructor() {
                this.datasets = [];
                this.images = [];
                this.currentImageIndex = -1;
                this.currentImage = null;
                this.annotations = [];
                
                this.initElements();
                this.bindEvents();
                this.loadData();
            }
            
            initElements() {
                this.datasetSelect = document.getElementById('datasetSelect');
                this.imageSelect = document.getElementById('imageSelect');
                this.detectBtn = document.getElementById('detectBtn');
                this.imagePlaceholder = document.getElementById('imagePlaceholder');
                this.currentImageEl = document.getElementById('currentImage');
                this.canvas = document.getElementById('annotationCanvas');
                this.detectionList = document.getElementById('detectionList');
                this.annotationCount = document.getElementById('annotationCount');
                this.avgConfidence = document.getElementById('avgConfidence');
                this.prevImageBtn = document.getElementById('prevImage');
                this.nextImageBtn = document.getElementById('nextImage');
                this.imageCounter = document.getElementById('imageCounter');
                this.exportResultsBtn = document.getElementById('exportResults');
                this.saveResultsBtn = document.getElementById('saveResults');
            }
            
            bindEvents() {
                this.datasetSelect.addEventListener('change', (e) => this.onDatasetChange(e));
                this.imageSelect.addEventListener('change', (e) => this.onImageChange(e));
                this.detectBtn.addEventListener('click', () => this.performDetection());
                this.prevImageBtn.addEventListener('click', () => this.loadPrevImage());
                this.nextImageBtn.addEventListener('click', () => this.loadNextImage());
                this.exportResultsBtn.addEventListener('click', () => this.exportResults());
                this.saveResultsBtn.addEventListener('click', () => this.saveResults());
            }
            
            async loadData() {
                try {
                    // 获取用户数据集
                    const token = localStorage.getItem('token');
                    if (!token) {
                        window.location.href = 'login.html';
                        return;
                    }
                    
                    const response = await fetch('/api/datasets', {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        this.datasets = data.data || [];
                        this.renderDatasets();
                    } else {
                        console.error('获取数据集失败:', response.status);
                    }
                } catch (error) {
                    console.error('加载数据失败:', error);
                }
            }
            
            renderDatasets() {
                this.datasetSelect.innerHTML = '<option value="">-- 请选择数据集 --</option>';
                this.datasets.forEach(dataset => {
                    const option = document.createElement('option');
                    option.value = dataset.id;
                    option.textContent = dataset.name;
                    this.datasetSelect.appendChild(option);
                });
            }
            
            async onDatasetChange(event) {
                const datasetId = event.target.value;
                if (!datasetId) {
                    this.imageSelect.innerHTML = '<option value="">-- 请先选择数据集 --</option>';
                    this.detectBtn.disabled = true;
                    return;
                }
                
                try {
                    const token = localStorage.getItem('token');
                    const response = await fetch(`/api/datasets/${datasetId}/images`, {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        this.images = data.data || [];
                        this.renderImages();
                        this.detectBtn.disabled = false;
                    }
                } catch (error) {
                    console.error('加载图片失败:', error);
                }
            }
            
            renderImages() {
                this.imageSelect.innerHTML = '<option value="">-- 请选择图片 --</option>';
                this.images.forEach((image, index) => {
                    const option = document.createElement('option');
                    option.value = image.id;
                    option.textContent = image.filename;
                    option.dataset.index = index;
                    this.imageSelect.appendChild(option);
                });
            }
            
            async onImageChange(event) {
                const imageId = event.target.value;
                if (!imageId) {
                    this.resetDisplay();
                    return;
                }
                
                const selectedIndex = Array.from(this.imageSelect.options).findIndex(opt => opt.selected);
                this.currentImageIndex = selectedIndex - 1; // 减去第一个选项的位置
                
                try {
                    // 获取图片详细信息
                    const token = localStorage.getItem('token');
                    const response = await fetch(`/api/images/${imageId}`, {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    
                    if (response.ok) {
                        const imageData = await response.json();
                        this.currentImage = imageData.data;
                        this.showImage(this.currentImage.file_path);
                        
                        // 检查是否已有标注
                        if (this.currentImage.annotations && this.currentImage.annotations.length > 0) {
                            this.annotations = this.currentImage.annotations;
                            this.renderAnnotations();
                        } else {
                            this.annotations = [];
                            this.clearDetectionList();
                        }
                        
                        this.updateNavigationButtons();
                    }
                } catch (error) {
                    console.error('加载图片失败:', error);
                }
            }
            
            showImage(imagePath) {
                this.imagePlaceholder.style.display = 'none';
                this.currentImageEl.src = imagePath;
                this.currentImageEl.style.display = 'block';
                
                // 当图片加载完成后，调整canvas大小并绘制标注
                this.currentImageEl.onload = () => {
                    this.canvas.width = this.currentImageEl.width;
                    this.canvas.height = this.currentImageEl.height;
                    this.canvas.style.display = 'block';
                    
                    // 绘制现有标注
                    if (this.annotations.length > 0) {
                        this.drawAnnotationsOnCanvas();
                    }
                };
            }
            
            async performDetection() {
                if (!this.currentImage) {
                    alert('请先选择一张图片');
                    return;
                }
                
                // 模拟AI检测过程（实际项目中这里应该是调用后端AI检测API）
                this.detectBtn.disabled = true;
                this.detectBtn.innerHTML = '<span class="spinner"></span> 检测中...';
                
                try {
                    // 这里应该是实际的AI检测API调用
                    // 示例：await fetch('/api/detection/run', {...})
                    
                    // 模拟检测结果
                    setTimeout(() => {
                        this.generateMockDetectionResults();
                        this.detectBtn.disabled = false;
                        this.detectBtn.innerHTML = '<span class="btn-icon">🔍</span> 开始AI检测';
                        this.exportResultsBtn.disabled = false;
                        this.saveResultsBtn.disabled = false;
                    }, 2000);
                } catch (error) {
                    console.error('检测失败:', error);
                    this.detectBtn.disabled = false;
                    this.detectBtn.innerHTML = '<span class="btn-icon">🔍</span> 开始AI检测';
                }
            }
            
            generateMockDetectionResults() {
                // 生成模拟检测结果
                const labels = ['发芽种子', '未发芽种子', '异常种子'];
                this.annotations = [];
                
                for (let i = 0; i < 5 + Math.floor(Math.random() * 6); i++) {
                    const annotation = {
                        id: i + 1,
                        label: labels[Math.floor(Math.random() * labels.length)],
                        x_min: Math.random() * 0.7,
                        y_min: Math.random() * 0.7,
                        x_max: Math.random() * 0.3 + 0.6,
                        y_max: Math.random() * 0.3 + 0.6,
                        confidence: parseFloat((Math.random() * 0.4 + 0.6).toFixed(2)),
                        created_at: new Date().toISOString()
                    };
                    
                    this.annotations.push(annotation);
                }
                
                this.renderAnnotations();
            }
            
            renderAnnotations() {
                if (this.annotations.length === 0) {
                    this.clearDetectionList();
                    return;
                }
                
                this.detectionList.innerHTML = '';
                
                this.annotations.forEach((ann, index) => {
                    const item = document.createElement('div');
                    item.className = 'detection-item';
                    item.innerHTML = `
                        <div class="detection-item-header">
                            <span class="detection-label" style="background-color: #3b82f6;">${ann.label}</span>
                            <span class="detection-confidence">置信度: ${(ann.confidence * 100).toFixed(1)}%</span>
                        </div>
                        <div class="detection-coords">
                            坐标: [${(ann.x_min * 100).toFixed(1)}%, ${(ann.y_min * 100).toFixed(1)}%, ${(ann.x_max * 100).toFixed(1)}%, ${(ann.y_max * 100).toFixed(1)}%]
                        </div>
                        <div class="detection-actions">
                            <button class="btn btn-small btn-secondary" onclick="detectionPage.selectAnnotation(${index})">查看</button>
                            <button class="btn btn-small btn-danger" onclick="detectionPage.deleteAnnotation(${index})">删除</button>
                        </div>
                    `;
                    this.detectionList.appendChild(item);
                });
                
                // 更新统计信息
                this.updateStats();
                
                // 在画布上绘制检测框
                this.drawAnnotationsOnCanvas();
            }
            
            clearDetectionList() {
                this.detectionList.innerHTML = '<p class="no-results">暂无检测结果</p>';
                this.objectCount.textContent = '0';
                this.avgConfidence.textContent = '0%';
            }
            
            updateStats() {
                const count = this.annotations.length;
                const avgConf = count > 0 
                    ? (this.annotations.reduce((sum, ann) => sum + ann.confidence, 0) / count * 100).toFixed(1) 
                    : 0;
                
                this.objectCount.textContent = count;
                this.avgConfidence.textContent = `${avgConf}%`;
            }
            
            drawAnnotationsOnCanvas() {
                if (!this.currentImageEl.complete || !this.canvas) return;
                
                const ctx = this.canvas.getContext('2d');
                ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                this.annotations.forEach((ann, index) => {
                    const x = ann.x_min * this.canvas.width;
                    const y = ann.y_min * this.canvas.height;
                    const width = (ann.x_max - ann.x_min) * this.canvas.width;
                    const height = (ann.y_max - ann.y_min) * this.canvas.height;
                    
                    // 绘制边框
                    ctx.strokeStyle = '#3b82f6';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x, y, width, height);
                    
                    // 绘制标签背景
                    ctx.fillStyle = 'rgba(59, 130, 246, 0.8)';
                    const text = `${ann.label} ${(ann.confidence * 100).toFixed(1)}%`;
                    const textSize = ctx.measureText(text);
                    ctx.fillRect(x, y - 20, textSize.width + 10, 20);
                    
                    // 绘制标签文字
                    ctx.fillStyle = 'white';
                    ctx.font = '14px Arial';
                    ctx.fillText(text, x + 5, y - 5);
                });
            }
            
            selectAnnotation(index) {
                // 高亮选中的标注
                const items = this.detectionList.querySelectorAll('.detection-item');
                items.forEach((item, i) => {
                    if (i === index) {
                        item.style.border = '2px solid #3b82f6';
                        item.style.backgroundColor = 'rgba(59, 130, 246, 0.1)';
                    } else {
                        item.style.border = '1px solid var(--border-color)';
                        item.style.backgroundColor = 'transparent';
                    }
                });
                
                // 在画布上高亮对应框
                this.highlightAnnotationOnCanvas(index);
            }
            
            highlightAnnotationOnCanvas(index) {
                if (!this.canvas) return;
                
                // 重新绘制所有标注
                this.drawAnnotationsOnCanvas();
                
                // 高亮选中的标注
                const ctx = this.canvas.getContext('2d');
                const ann = this.annotations[index];
                
                const x = ann.x_min * this.canvas.width;
                const y = ann.y_min * this.canvas.height;
                const width = (ann.x_max - ann.x_min) * this.canvas.width;
                const height = (ann.y_max - ann.y_min) * this.canvas.height;
                
                // 用不同颜色绘制选中标注
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 3;
                ctx.strokeRect(x, y, width, height);
            }
            
            deleteAnnotation(index) {
                if (confirm('确定要删除这个检测结果吗？')) {
                    this.annotations.splice(index, 1);
                    this.renderAnnotations();
                }
            }
            
            updateNavigationButtons() {
                this.prevImageBtn.disabled = this.currentImageIndex <= 0;
                this.nextImageBtn.disabled = this.currentImageIndex >= this.images.length - 1;
                this.imageCounter.textContent = `${this.currentImageIndex + 1} / ${this.images.length}`;
            }
            
            loadPrevImage() {
                if (this.currentImageIndex > 0) {
                    this.currentImageIndex--;
                    const imageId = this.images[this.currentImageIndex].id;
                    this.imageSelect.value = imageId;
                    this.onImageChange({ target: this.imageSelect });
                }
            }
            
            loadNextImage() {
                if (this.currentImageIndex < this.images.length - 1) {
                    this.currentImageIndex++;
                    const imageId = this.images[this.currentImageIndex].id;
                    this.imageSelect.value = imageId;
                    this.onImageChange({ target: this.imageSelect });
                }
            }
            
            exportResults() {
                if (this.annotations.length === 0) {
                    alert('没有检测结果可导出');
                    return;
                }
                
                const dataStr = JSON.stringify(this.annotations, null, 2);
                const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
                
                const exportFileDefaultName = `detection_results_${this.currentImage.id}.json`;
                
                const linkElement = document.createElement('a');
                linkElement.setAttribute('href', dataUri);
                linkElement.setAttribute('download', exportFileDefaultName);
                linkElement.click();
            }
            
            async saveResults() {
                if (!this.currentImage) {
                    alert('没有选中图片');
                    return;
                }
                
                if (this.annotations.length === 0) {
                    alert('没有检测结果可保存');
                    return;
                }
                
                try {
                    const token = localStorage.getItem('token');
                    const response = await fetch(`/api/images/${this.currentImage.id}/annotations`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ annotations: this.annotations })
                    });
                    
                    if (response.ok) {
                        alert('检测结果已保存！');
                    } else {
                        alert('保存失败');
                    }
                } catch (error) {
                    console.error('保存检测结果失败:', error);
                    alert('保存失败: ' + error.message);
                }
            }
            
            resetDisplay() {
                this.imagePlaceholder.style.display = 'flex';
                this.currentImageEl.style.display = 'none';
                this.canvas.style.display = 'none';
                this.clearDetectionList();
                this.prevImageBtn.disabled = true;
                this.nextImageBtn.disabled = true;
                this.exportResultsBtn.disabled = true;
                this.saveResultsBtn.disabled = true;
            }
        }
        
            // 初始化页面
            window.detectionPage = new DetectionPage();
        }
    </script>
</body>
</html>
    </script>
</body>
</html>
