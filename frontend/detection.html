<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI检测结果 - SeedAI</title>
    <link rel="stylesheet" href="style.css?v=20260309a">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
    <style>
        .detect-page {
            padding: 8px 0 24px;
            background: #ececec;
        }

        .detect-hero {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 20px;
            padding: 14px 22px;
            background: #2856d4;
            border: 2px solid #2ea4f7;
            color: #fff;
        }

        .detect-hero h2 {
            margin: 0;
            font-size: 44px;
            letter-spacing: 1px;
        }

        .detect-hero p {
            margin: 8px 0 14px;
            font-size: 18px;
            opacity: 0.95;
        }

        .hero-select-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f3f4f6;
            padding: 8px 12px;
            width: 78%;
            color: #0f172a;
            margin-bottom: 12px;
        }

        .hero-select-row label {
            font-size: 20px;
            font-weight: 700;
            line-height: 1;
            white-space: nowrap;
        }

        .hero-select-row select {
            flex: 1;
            height: 42px;
            font-size: 24px;
            border: 0;
            background: transparent;
            color: #111827;
        }

        .detect-meta {
            display: flex;
            gap: 38px;
            flex-wrap: wrap;
            font-size: 20px;
            font-weight: 600;
            line-height: 1.2;
        }

        .detect-hero img {
            width: 100%;
            height: 265px;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.35);
        }

        .top-workspace {
            display: grid;
            grid-template-columns: 44% 56%;
            gap: 16px;
            margin-top: 12px;
        }

        .detect-panel {
            padding: 10px;
        }

        .file-search {
            width: 100%;
            height: 42px;
            border: 1px solid #d1d5db;
            font-size: 24px;
            padding: 0 10px;
            background: #f9fafb;
        }

        .panel-filter {
            margin: 8px 0;
            display: flex;
            gap: 18px;
            flex-wrap: nowrap;
            align-items: center;
            font-size: 20px;
            font-weight: 600;
            line-height: 1.2;
            white-space: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
        }

        .panel-filter label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            height: 24px;
            line-height: 24px;
            flex: 0 0 auto;
        }

        .panel-filter input {
            width: 24px;
            height: 24px;
            margin: 0;
            display: inline-block;
            flex: 0 0 24px;
            vertical-align: middle;
        }

        .file-list {
            border: 0;
            background: #fff;
            height: 250px;
            overflow: auto;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 4px;
            border: 0;
            border-bottom: 1px solid #e5e7eb;
            width: 100%;
            text-align: left;
            background: #fff;
            padding: 2px 4px;
            font-size: 20px;
            line-height: 1;
            color: #000;
        }

        .file-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin: 0;
            flex: 0 0 16px;
        }

        .file-item-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-left: 0;
            min-width: 0;
            width: 100%;
        }

        .file-item-name,
        .file-item-mark {
            font-size: 20px;
            line-height: 1;
        }

        .file-item-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            min-width: 0;
            flex: 1;
        }

        .file-item-mark {
            color: #000;
            white-space: nowrap;
        }

        .file-item.active {
            background: #d1d5db;
        }

        .file-item:hover {
            background: #eceff3;
        }

        .file-item.active:hover {
            background: #d1d5db;
        }

        .detector-config {
            margin-top: 12px;
        }

        .config-row {
            display: grid;
            grid-template-columns: 110px 1fr;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .config-row label {
            font-size: 18px;
            font-weight: 700;
        }

        .config-row select,
        .config-row input {
            height: 46px;
            border: 1px solid #d1d5db;
            background: #e5e7eb;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
        }

        .panel-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 6px;
        }

        .panel-actions .btn,
        .mode-switch .btn {
            border-radius: 28px;
            padding: 11px 20px;
            font-size: 16px;
            min-width: 145px;
        }

        .mode-switch {
            margin-top: 8px;
            display: flex;
            gap: 10px;
        }

        .mode-switch .btn.active {
            background: #1d4ed8;
            color: #fff;
        }

        .counter-line {
            margin-top: 8px;
            color: #64748b;
            font-size: 15px;
        }

        .detect-canvas-card {
            background: #e5e7eb;
            border: 1px solid #d1d5db;
            padding: 8px;
        }

        .canvas-wrap {
            position: relative;
            height: 560px;
            overflow: auto;
            border: 1px solid #cbd5e1;
            background: #fff;
            cursor: default;
        }

        .canvas-wrap.space-pan {
            cursor: grab;
        }

        .canvas-wrap.panning {
            cursor: grabbing;
        }

        .viewer-stage {
            position: relative;
            display: inline-block;
        }

        .viewer-stage img {
            display: block;
        }

        .viewer-stage canvas {
            position: absolute;
            left: 0;
            top: 0;
            pointer-events: none;
        }

        .placeholder {
            color: #64748b;
            font-size: 18px;
        }

        .viewer-foot {
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .viewer-stats {
            font-size: 15px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .zoom-controls {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-left: 8px;
        }

        .zoom-controls .btn {
            padding: 5px 10px;
            min-width: 44px;
        }

        .zoom-value {
            min-width: 54px;
            text-align: center;
            font-weight: 700;
        }

        .results-grid {
            margin-top: 14px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .result-card {
            border: 2px solid #525252;
            border-radius: 18px;
            background: #ececec;
            overflow: hidden;
        }

        .result-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #525252;
            padding: 9px 12px;
            font-size: 20px;
            font-weight: 700;
        }

        .result-list {
            height: 230px;
            overflow: auto;
            background: #f5f5f5;
        }

        .result-row {
            border: 1px solid #cfd4dc;
            border-radius: 10px;
            width: 100%;
            padding: 7px 10px;
            text-align: left;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: flex-start;
            font-size: 13px;
            line-height: 1;
            background: #fff;
            margin: 6px;
        }

        .result-row.active {
            box-shadow: inset 0 0 0 2px #111827;
            font-weight: 700;
        }

        .result-empty {
            padding: 18px;
            color: #64748b;
            font-size: 12px;
        }

        .result-label {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 14px;
            line-height: 1;
        }

        .result-main {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
        }

        .result-class {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            min-width: 0;
        }

        .result-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            flex: 0 0 9px;
        }

        .result-bbox {
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .result-conf {
            text-align: left;
            font-weight: 700;
            font-size: 13px;
            white-space: nowrap;
        }

        .result-index {
            font-weight: 700;
            min-width: 20px;
        }

        .result-checkbox {
            width: 13px;
            height: 13px;
            margin: 0;
            flex: 0 0 13px;
            pointer-events: none;
        }

        @media (max-width: 1100px) {
            .detect-hero {
                grid-template-columns: 1fr;
            }

            .hero-select-row {
                width: 100%;
            }

            .top-workspace,
            .results-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <h1>🌱 SeedAI</h1>
                    <span class="subtitle">AI图像标注平台</span>
                </div>
                <nav class="nav">
                    <ul>
                        <li><a href="index.html">首页</a></li>
                        <li><a href="spectrum.html">光谱分析</a></li>
                        <li><a href="detection.html" class="active">AI检测</a></li>
                        <li><a href="dataset.html">数据集</a></li>
                        <li><a href="annotate.html">手工标注</a></li>
                        <li><a href="javascript:void(0)" id="profileLink" style="display:none;"><span id="usernameDisplay"></span><span id="logoutLink" style="cursor:pointer;margin-left:10px;">退出</span></a></li>
                        <li><a href="login.html" id="loginLink">登录</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="main detect-page">
        <div class="container">
            <section class="detect-hero">
                <div>
                    <h2>AI检测结果</h2>
                    <p>使用深度学习模型自动检测图片中的种子发芽情况</p>
                    <div class="hero-select-row">
                        <label for="datasetSelect">选择数据集:</label>
                        <select id="datasetSelect"><option value="">-- 请选择数据集 --</option></select>
                    </div>
                    <div class="detect-meta">
                        <span id="metaDataset">数据集: -</span>
                        <span id="metaCount">数据量: 0</span>
                        <span id="metaAnnotated">已标注: 0</span>
                    </div>
                </div>
                <img src="resource/img/detection-1.png" alt="seed preview">
            </section>

            <section class="top-workspace">
                <aside class="detect-panel">
                    <div class="panel-head">
                        <h3 style="margin:0;font-size:18px;">文件列表</h3>
                    </div>
                    <input id="searchInput" class="file-search" type="text" placeholder="搜索文件名">
                    <div class="panel-filter">
                        <label><input type="checkbox" id="unannotatedOnly" checked> 未标注数据</label>
                        <label><input type="checkbox" id="annotatedOnly"> 已标注数据</label>
                    </div>
                    <div id="fileList" class="file-list"></div>

                    <div class="detector-config">
                        <div class="config-row">
                            <label for="modelSelect">选择模型 :</label>
                            <select id="modelSelect">
                                <option value="">-- 正在加载模型 --</option>
                            </select>
                        </div>
                        <div class="config-row">
                            <label for="thresholdInput">设置阈值 :</label>
                            <input id="thresholdInput" type="number" min="0" max="1" step="0.01" value="0.8">
                        </div>
                        <div class="config-row" style="display:none;">
                            <label for="imageSelect">图片 :</label>
                            <select id="imageSelect"><option value="">-- 请先选择数据集 --</option></select>
                        </div>
                        <div class="panel-actions">
                            <button id="detectBtn" class="btn btn-primary" disabled>开始AI检测</button>
                            <button id="saveBtn" class="btn btn-primary" disabled>保存标注</button>
                        </div>
                        <div class="mode-switch">
                            <button id="showOriginalBtn" class="btn btn-secondary active">显示原始标注</button>
                            <button id="showAiBtn" class="btn btn-secondary">显示AI检测</button>
                        </div>
                        <div class="counter-line">文件计数: <span id="counterText">0 / 0</span></div>
                        <div class="counter-line">检测状态: <span id="detectStatus">未执行</span></div>
                    </div>
                </aside>

                <div class="detect-canvas-card">
                    <div class="canvas-wrap" id="canvasWrap">
                        <div id="placeholder" class="placeholder">请选择图片后进行检测</div>
                        <div id="viewerStage" class="viewer-stage" style="display:none;">
                            <img id="viewerImage" alt="检测图像" style="display:none;">
                            <canvas id="viewerCanvas" style="display:none;"></canvas>
                        </div>
                    </div>
                    <div class="viewer-foot">
                        <div>
                            <button id="prevBtn" class="btn btn-secondary" disabled>← 上一张</button>
                            <button id="nextBtn" class="btn btn-secondary" disabled>下一张 →</button>
                        </div>
                        <div class="viewer-stats">
                            <span>显示模式: <strong id="modeText">原始标注</strong></span>
                            <span>平均置信度: <strong id="avgConfidence">0%</strong></span>
                            <div class="zoom-controls">
                                <button id="zoomOutBtn" class="btn btn-secondary" type="button">-</button>
                                <span id="zoomValue" class="zoom-value">100%</span>
                                <button id="zoomInBtn" class="btn btn-secondary" type="button">+</button>
                                <button id="zoomResetBtn" class="btn btn-secondary" type="button">重置</button>
                            </div>
                            <button id="exportBtn" class="btn btn-secondary" disabled style="padding:6px 10px;">导出</button>
                        </div>
                    </div>
                </div>
            </section>

            <section class="results-grid">
                <div class="result-card">
                    <div class="result-head"><span>标注文件</span><span>类别数量: <span id="originCount">0</span></span><span>目标框数量: <span id="counterTextBottom">0</span></span></div>
                    <div id="originList" class="result-list"></div>
                </div>
                <div class="result-card">
                    <div class="result-head"><span>检测结果</span><span>检测目标数: <span id="aiCount">0</span></span><span> </span></div>
                    <div id="aiList" class="result-list"></div>
                </div>
            </section>
        </div>
    </main>

    <script src="js/api-contract.js"></script>
    <script src="js/shared.js"></script>
    <script>
        class DetectionWorkspace {
            constructor() {
                this.datasets = [];
                this.images = [];
                this.models = [];
                this.filteredImages = [];
                this.currentImageIndex = -1;
                this.currentImage = null;
                this.currentObjectUrl = null;

                this.originalAnnotations = [];
                this.aiAnnotations = [];
                this.selectedOriginIndex = -1;
                this.selectedAiIndex = -1;
                this.viewMode = 'original';
                this.zoomLevel = 1;
                this.minZoom = 0.2;
                this.maxZoom = 5;
                this.spacePressed = false;
                this.isPanning = false;
                this.panStartX = 0;
                this.panStartY = 0;
                this.scrollStartLeft = 0;
                this.scrollStartTop = 0;
                this.imageNaturalWidth = 0;
                this.imageNaturalHeight = 0;
                this.classColorMap = new Map();
                this.classPalette = ['#e11d48', '#0ea5e9', '#16a34a', '#f59e0b', '#7c3aed', '#db2777', '#0891b2', '#65a30d', '#dc2626', '#2563eb'];
                this.currentClassList = [];
                this.thresholdTouched = false;

                this.bindElements();
                this.bindEvents();
                this.init();
            }

            bindElements() {
                this.datasetSelect = document.getElementById('datasetSelect');
                this.imageSelect = document.getElementById('imageSelect');
                this.modelSelect = document.getElementById('modelSelect');
                this.thresholdInput = document.getElementById('thresholdInput');
                this.detectBtn = document.getElementById('detectBtn');
                this.saveBtn = document.getElementById('saveBtn');
                this.exportBtn = document.getElementById('exportBtn');
                this.showOriginalBtn = document.getElementById('showOriginalBtn');
                this.showAiBtn = document.getElementById('showAiBtn');
                this.prevBtn = document.getElementById('prevBtn');
                this.nextBtn = document.getElementById('nextBtn');
                this.zoomInBtn = document.getElementById('zoomInBtn');
                this.zoomOutBtn = document.getElementById('zoomOutBtn');
                this.zoomResetBtn = document.getElementById('zoomResetBtn');
                this.zoomValue = document.getElementById('zoomValue');

                this.fileList = document.getElementById('fileList');
                this.searchInput = document.getElementById('searchInput');
                this.unannotatedOnly = document.getElementById('unannotatedOnly');
                this.annotatedOnly = document.getElementById('annotatedOnly');

                this.originList = document.getElementById('originList');
                this.aiList = document.getElementById('aiList');
                this.originCount = document.getElementById('originCount');
                this.aiCount = document.getElementById('aiCount');
                this.counterTextBottom = document.getElementById('counterTextBottom');
                this.avgConfidence = document.getElementById('avgConfidence');

                this.metaDataset = document.getElementById('metaDataset');
                this.metaCount = document.getElementById('metaCount');
                this.metaAnnotated = document.getElementById('metaAnnotated');
                this.counterText = document.getElementById('counterText');
                this.modeText = document.getElementById('modeText');
                this.detectStatus = document.getElementById('detectStatus');

                this.viewerImage = document.getElementById('viewerImage');
                this.viewerCanvas = document.getElementById('viewerCanvas');
                this.placeholder = document.getElementById('placeholder');
                this.canvasWrap = document.getElementById('canvasWrap');
                this.viewerStage = document.getElementById('viewerStage');
            }

            bindEvents() {
                this.datasetSelect.addEventListener('change', () => this.onDatasetChange());
                this.imageSelect.addEventListener('change', () => this.onImageSelect());
                this.detectBtn.addEventListener('click', () => this.runDetection());
                this.saveBtn.addEventListener('click', () => this.saveAnnotations());
                this.exportBtn.addEventListener('click', () => this.exportResults());
                this.modelSelect.addEventListener('change', () => this.syncThresholdByModel(false));
                this.thresholdInput.addEventListener('input', () => {
                    this.thresholdTouched = true;
                });
                this.showOriginalBtn.addEventListener('click', () => this.setViewMode('original'));
                this.showAiBtn.addEventListener('click', () => this.setViewMode('ai'));
                this.prevBtn.addEventListener('click', () => this.goRelative(-1));
                this.nextBtn.addEventListener('click', () => this.goRelative(1));
                this.zoomInBtn.addEventListener('click', () => this.setZoom(this.zoomLevel * 1.2));
                this.zoomOutBtn.addEventListener('click', () => this.setZoom(this.zoomLevel / 1.2));
                this.zoomResetBtn.addEventListener('click', () => this.fitZoomToCanvas());

                this.searchInput.addEventListener('input', () => this.renderFileList());
                this.unannotatedOnly.addEventListener('change', () => this.handleFilterCheckboxChange('un'));
                this.annotatedOnly.addEventListener('change', () => this.handleFilterCheckboxChange('an'));

                window.addEventListener('wheel', (event) => {
                    if (!event.ctrlKey) {
                        return;
                    }
                    const inCanvasArea = this.canvasWrap && this.canvasWrap.contains(event.target);
                    if (!inCanvasArea) {
                        return;
                    }

                    event.preventDefault();

                    if (!this.currentImage) {
                        return;
                    }

                    const factor = event.deltaY < 0 ? 1.1 : 0.9;
                    this.setZoom(this.zoomLevel * factor);
                }, { passive: false, capture: true });

                this.canvasWrap.addEventListener('mousedown', (event) => {
                    if (!this.spacePressed || !this.currentImage) {
                        return;
                    }
                    this.isPanning = true;
                    this.canvasWrap.classList.add('panning');
                    this.panStartX = event.clientX;
                    this.panStartY = event.clientY;
                    this.scrollStartLeft = this.canvasWrap.scrollLeft;
                    this.scrollStartTop = this.canvasWrap.scrollTop;
                    event.preventDefault();
                });

                this.canvasWrap.addEventListener('mousemove', (event) => {
                    if (!this.isPanning) {
                        return;
                    }
                    const deltaX = event.clientX - this.panStartX;
                    const deltaY = event.clientY - this.panStartY;
                    this.canvasWrap.scrollLeft = this.scrollStartLeft - deltaX;
                    this.canvasWrap.scrollTop = this.scrollStartTop - deltaY;
                });

                this.canvasWrap.addEventListener('mouseup', () => this.stopPanning());
                this.canvasWrap.addEventListener('mouseleave', () => this.stopPanning());

                document.addEventListener('keydown', (event) => {
                    if (event.code !== 'Space') {
                        return;
                    }
                    const tag = (event.target && event.target.tagName) ? event.target.tagName.toLowerCase() : '';
                    if (tag === 'input' || tag === 'textarea' || tag === 'select' || event.target.isContentEditable) {
                        return;
                    }
                    event.preventDefault();
                    this.spacePressed = true;
                    this.canvasWrap.classList.add('space-pan');
                });

                document.addEventListener('keyup', (event) => {
                    if (event.code !== 'Space') {
                        return;
                    }
                    this.spacePressed = false;
                    this.canvasWrap.classList.remove('space-pan');
                    this.stopPanning();
                });

                this.syncThresholdByModel(false);
            }

            syncThresholdByModel(forceUpdate) {
                const selectedModel = this.getSelectedModel();
                const modelName = String((selectedModel && selectedModel.model_name) || '').toLowerCase();
                let suggested = 0.25;
                if (modelName.includes('faster-rcnn') || modelName.includes('mmdet')) {
                    suggested = 0.05;
                }

                const shouldApply = forceUpdate || !this.thresholdTouched;
                if (!shouldApply) {
                    return;
                }

                this.thresholdInput.value = suggested.toFixed(2);
            }

            stopPanning() {
                this.isPanning = false;
                this.canvasWrap.classList.remove('panning');
            }

            setZoom(nextZoom, resetCenter = false) {
                if (!this.currentImage || !this.imageNaturalWidth || !this.imageNaturalHeight) {
                    return;
                }

                const prevZoom = this.zoomLevel;
                const clamped = Math.max(this.minZoom, Math.min(this.maxZoom, Number(nextZoom) || 1));
                this.zoomLevel = clamped;

                const wrap = this.canvasWrap;
                const centerX = resetCenter ? (wrap.clientWidth / 2) / clamped : (wrap.scrollLeft + wrap.clientWidth / 2) / prevZoom;
                const centerY = resetCenter ? (wrap.clientHeight / 2) / clamped : (wrap.scrollTop + wrap.clientHeight / 2) / prevZoom;

                const scaledWidth = this.imageNaturalWidth * this.zoomLevel;
                const scaledHeight = this.imageNaturalHeight * this.zoomLevel;

                this.viewerStage.style.width = `${scaledWidth}px`;
                this.viewerStage.style.height = `${scaledHeight}px`;
                this.viewerImage.style.width = `${scaledWidth}px`;
                this.viewerImage.style.height = `${scaledHeight}px`;
                this.viewerCanvas.style.width = `${scaledWidth}px`;
                this.viewerCanvas.style.height = `${scaledHeight}px`;

                this.zoomValue.textContent = `${Math.round(this.zoomLevel * 100)}%`;

                wrap.scrollLeft = Math.max(0, centerX * this.zoomLevel - wrap.clientWidth / 2);
                wrap.scrollTop = Math.max(0, centerY * this.zoomLevel - wrap.clientHeight / 2);
            }

            fitZoomToCanvas() {
                if (!this.currentImage || !this.imageNaturalWidth || !this.imageNaturalHeight) {
                    return;
                }
                const wrapWidth = this.canvasWrap.clientWidth || 1;
                const wrapHeight = this.canvasWrap.clientHeight || 1;
                const ratioX = wrapWidth / this.imageNaturalWidth;
                const ratioY = wrapHeight / this.imageNaturalHeight;
                const fitZoom = Math.min(1, ratioX, ratioY);
                this.setZoom(fitZoom, true);
            }

            async init() {
                if (!SeedAI.auth.requireLogin('login.html')) {
                    return;
                }

                await SeedAI.auth.applyUserNav({
                    loginLinkId: 'loginLink',
                    profileLinkId: 'profileLink',
                    usernameId: 'usernameDisplay',
                    logoutId: 'logoutLink',
                    logoutHref: 'index.html'
                });

                await this.loadModels();
                await this.loadDatasets();
            }

            formatModelDisplayName(model) {
                const raw = String((model && model.model_name) || '').trim();
                if (!raw) {
                    return `模型#${model && model.id ? model.id : '-'}`;
                }
                if (raw === 'faster-rcnn-soybean') {
                    return 'Faster-RCNN (Soybean)';
                }
                if (raw === 'yolov5-soybean') {
                    return 'YOLOv5 (Soybean)';
                }
                return raw;
            }

            getSelectedModel() {
                const selectedId = Number(this.modelSelect && this.modelSelect.value);
                if (!selectedId) {
                    return null;
                }
                return this.models.find((item) => Number(item.id) === selectedId) || null;
            }

            async loadModels() {
                try {
                    const payload = await SeedAI.api.get('/models');
                    this.models = ((payload && payload.data) || []).filter((item) => !!item && Number(item.id));

                    if (!this.models.length) {
                        this.modelSelect.innerHTML = '<option value="">-- 暂无可用模型 --</option>';
                        return;
                    }

                    this.modelSelect.innerHTML = this.models.map((model) => {
                        const activeMark = model.is_active ? ' [默认]' : '';
                        const text = `${this.escapeHtml(this.formatModelDisplayName(model))}${activeMark}`;
                        return `<option value="${model.id}">${text}</option>`;
                    }).join('');

                    const activeModel = this.models.find((item) => !!item.is_active);
                    if (activeModel) {
                        this.modelSelect.value = String(activeModel.id);
                    }
                    this.syncThresholdByModel(true);
                } catch (error) {
                    this.modelSelect.innerHTML = '<option value="">-- 模型加载失败 --</option>';
                    alert(error.message || '加载模型列表失败');
                }
            }

            async loadDatasets() {
                try {
                    const payload = await SeedAI.api.get('/datasets');
                    this.datasets = (payload && payload.data) || [];
                    this.datasetSelect.innerHTML = '<option value="">-- 请选择数据集 --</option>';
                    this.datasets.forEach((item) => {
                        const option = document.createElement('option');
                        option.value = String(item.id);
                        option.textContent = item.name;
                        this.datasetSelect.appendChild(option);
                    });
                } catch (error) {
                    alert(error.message || '加载数据集失败');
                }
            }

            async onDatasetChange() {
                const datasetId = Number(this.datasetSelect.value);
                this.resetViewerState();

                if (!datasetId) {
                    this.imageSelect.innerHTML = '<option value="">-- 请先选择数据集 --</option>';
                    this.images = [];
                    this.filteredImages = [];
                    this.renderFileList();
                    return;
                }

                const dataset = this.datasets.find((it) => Number(it.id) === datasetId);
                this.metaDataset.textContent = `数据集: ${dataset ? dataset.name : '-'}`;

                try {
                    const payload = await SeedAI.api.get(`/datasets/${datasetId}/images`);
                    this.images = (payload && payload.data) || [];
                    this.filteredImages = this.images.slice();

                    const annotatedCount = this.images.filter((it) => !!(it.annotations_path && String(it.annotations_path).trim())).length;
                    this.metaCount.textContent = `数据量: ${this.images.length}`;
                    this.metaAnnotated.textContent = `已标注: ${annotatedCount}`;

                    this.imageSelect.innerHTML = '<option value="">-- 请选择图片 --</option>';
                    this.images.forEach((image) => {
                        const option = document.createElement('option');
                        option.value = String(image.id);
                        option.textContent = image.original_filename || image.filename;
                        this.imageSelect.appendChild(option);
                    });

                    this.renderFileList();
                } catch (error) {
                    alert(error.message || '加载图片失败');
                }
            }

            handleFilterCheckboxChange(type) {
                if (type === 'un' && this.unannotatedOnly.checked) {
                    this.annotatedOnly.checked = false;
                }
                if (type === 'an' && this.annotatedOnly.checked) {
                    this.unannotatedOnly.checked = false;
                }
                this.renderFileList();
            }

            renderFileList() {
                const keyword = (this.searchInput.value || '').trim().toLowerCase();
                const onlyUn = this.unannotatedOnly.checked;
                const onlyAn = this.annotatedOnly.checked;

                this.filteredImages = this.images.filter((image) => {
                    const name = String(image.original_filename || image.filename || '').toLowerCase();
                    if (keyword && !name.includes(keyword)) {
                        return false;
                    }

                    const hasAnn = !!(image.annotations_path && String(image.annotations_path).trim());
                    if (onlyUn) {
                        return !hasAnn;
                    }
                    if (onlyAn) {
                        return hasAnn;
                    }
                    return true;
                });

                if (!this.filteredImages.length) {
                    this.fileList.innerHTML = '<div class="result-empty">暂无匹配文件</div>';
                    this.counterText.textContent = '0 / 0';
                    if (this.counterTextBottom) {
                        this.counterTextBottom.textContent = '0';
                    }
                    return;
                }

                this.fileList.innerHTML = this.filteredImages.map((image) => {
                    const active = this.currentImage && Number(this.currentImage.id) === Number(image.id) ? ' active' : '';
                    const mark = image.annotations_path ? '已标注' : '未标注';
                    return `<button class="file-item${active}" data-image-id="${image.id}" type="button"><input type="checkbox" ${active ? 'checked' : ''} disabled><div class="file-item-main"><span class="file-item-name">${this.escapeHtml(image.original_filename || image.filename)}</span><small class="file-item-mark">${mark}</small></div></button>`;
                }).join('');

                this.counterText.textContent = `${this.currentImageIndex >= 0 ? this.currentImageIndex + 1 : 0} / ${this.filteredImages.length}`;
                if (this.counterTextBottom) {
                    this.counterTextBottom.textContent = String(this.currentImageIndex >= 0 ? this.currentImageIndex + 1 : 0);
                }

                this.fileList.querySelectorAll('[data-image-id]').forEach((node) => {
                    node.addEventListener('click', async () => {
                        const imageId = Number(node.dataset.imageId);
                        this.imageSelect.value = String(imageId);
                        await this.onImageSelect();
                    });
                });
            }

            async onImageSelect() {
                const imageId = Number(this.imageSelect.value);
                this.resetImageOnly();

                if (!imageId) {
                    this.renderFileList();
                    return;
                }

                this.currentImageIndex = this.filteredImages.findIndex((it) => Number(it.id) === imageId);
                if (this.currentImageIndex < 0) {
                    this.currentImageIndex = this.images.findIndex((it) => Number(it.id) === imageId);
                }

                try {
                    const imagePayload = await SeedAI.api.get(`/images/${imageId}`);
                    this.currentImage = imagePayload.data;

                    const annoPayload = await SeedAI.api.get(`/images/${imageId}/annotations`);
                    const originalRows = (annoPayload && annoPayload.data && annoPayload.data.annotations) || [];
                    this.originalAnnotations = this.normalizeAnnotationList(originalRows, false);

                    await this.loadImageContent(imageId);

                    this.renderAnnotationsPanel();
                    this.detectBtn.disabled = false;
                    this.prevBtn.disabled = this.currentImageIndex <= 0;
                    this.nextBtn.disabled = this.currentImageIndex >= this.filteredImages.length - 1;
                    this.renderFileList();
                    this.drawCurrentView();
                } catch (error) {
                    alert(error.message || '加载图片失败');
                }
            }

            async loadImageContent(imageId) {
                if (this.currentObjectUrl) {
                    URL.revokeObjectURL(this.currentObjectUrl);
                    this.currentObjectUrl = null;
                }

                const token = SeedAI.token.get();
                const response = await fetch(`/api/images/${imageId}/content`, {
                    headers: token ? { Authorization: `Bearer ${token}` } : {}
                });

                if (!response.ok) {
                    throw new Error(`图片加载失败: HTTP ${response.status}`);
                }

                const blob = await response.blob();
                this.currentObjectUrl = URL.createObjectURL(blob);

                await new Promise((resolve) => {
                    this.viewerImage.onload = () => resolve();
                    this.viewerImage.src = this.currentObjectUrl;
                });

                this.placeholder.style.display = 'none';
                this.viewerStage.style.display = 'inline-block';
                this.viewerImage.style.display = 'block';
                this.viewerCanvas.style.display = 'block';
                this.viewerCanvas.width = this.viewerImage.naturalWidth;
                this.viewerCanvas.height = this.viewerImage.naturalHeight;
                this.imageNaturalWidth = this.viewerImage.naturalWidth;
                this.imageNaturalHeight = this.viewerImage.naturalHeight;
                this.fitZoomToCanvas();
            }

            async runDetection() {
                if (!this.currentImage) {
                    alert('请先选择图片');
                    return;
                }

                const threshold = Number(this.thresholdInput.value);
                if (Number.isNaN(threshold) || threshold < 0 || threshold > 1) {
                    alert('阈值必须在0到1之间');
                    return;
                }

                this.detectBtn.disabled = true;
                this.detectBtn.innerHTML = '<span class="spinner"></span> 检测中...';
                this.detectStatus.textContent = '检测中...';

                try {
                    const selectedModel = this.getSelectedModel();
                    if (!selectedModel) {
                        throw new Error('请先选择有效模型');
                    }
                    const requestBody = {
                        conf_threshold: threshold
                    };
                    requestBody.model_id = Number(selectedModel.id);

                    const payload = await SeedAI.api.post(`/images/${this.currentImage.id}/detect`, requestBody);
                    const responseData = (payload && payload.data) || {};
                    this.currentClassList = Array.isArray(responseData.class_list) ? responseData.class_list : [];
                    this.aiAnnotations = this.normalizeAnnotationList(responseData.annotations || [], true);
                    const modelText = this.formatModelDisplayName(selectedModel);
                    this.detectStatus.textContent = `完成: 模型 ${modelText}，阈值 ${this.formatNumber(threshold, 2)}，检测到 ${this.aiAnnotations.length} 个目标`;
                    this.selectedOriginIndex = -1;
                    this.selectedAiIndex = this.aiAnnotations.length > 0 ? 0 : -1;
                    this.setViewMode('ai');
                    this.renderAnnotationsPanel();
                    this.drawCurrentView();
                    this.saveBtn.disabled = this.aiAnnotations.length === 0;
                    this.exportBtn.disabled = this.aiAnnotations.length === 0;
                } catch (error) {
                    this.detectStatus.textContent = `失败: ${error.message || 'AI检测失败'}`;
                    alert(error.message || 'AI检测失败');
                } finally {
                    this.detectBtn.disabled = false;
                    this.detectBtn.textContent = '开始AI检测';
                }
            }

            setViewMode(mode) {
                this.viewMode = mode === 'ai' ? 'ai' : 'original';
                this.showOriginalBtn.classList.toggle('active', this.viewMode === 'original');
                this.showAiBtn.classList.toggle('active', this.viewMode === 'ai');
                this.modeText.textContent = this.viewMode === 'ai' ? 'AI检测' : '原始标注';
                this.drawCurrentView();
            }

            drawCurrentView() {
                const canvas = this.viewerCanvas;
                const image = this.viewerImage;
                if (!canvas || image.style.display === 'none') {
                    return;
                }

                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const rows = this.viewMode === 'ai' ? this.aiAnnotations : this.originalAnnotations;
                rows.forEach((ann, index) => {
                    const x = ann.x_min * canvas.width;
                    const y = ann.y_min * canvas.height;
                    const w = (ann.x_max - ann.x_min) * canvas.width;
                    const h = (ann.y_max - ann.y_min) * canvas.height;
                    const isActive = this.viewMode === 'ai'
                        ? this.selectedAiIndex === index
                        : this.selectedOriginIndex === index;
                    const classColor = this.getClassColor(ann.label || 'unknown');

                    ctx.strokeStyle = classColor;
                    ctx.lineWidth = isActive ? 8 : 2;
                    const drawW = Math.max(3, w);
                    const drawH = Math.max(3, h);
                    ctx.strokeRect(x, y, drawW, drawH);

                    if (w < 3 || h < 3) {
                        ctx.fillStyle = classColor;
                        ctx.fillRect(x - 1, y - 1, 4, 4);
                    }

                    const confidenceText = this.viewMode === 'ai' ? ` ${this.formatNumber(ann.confidence, 4)}` : '';
                    const label = `${ann.label || 'unknown'}${confidenceText}`;
                    ctx.font = '14px Arial';
                    const tw = ctx.measureText(label).width;
                    ctx.fillStyle = this.hexToRgba(classColor, 0.88);
                    const tagX = Math.max(0, Math.min(canvas.width - (tw + 10), x));
                    const tagY = Math.max(0, y - 22);
                    ctx.fillRect(tagX, tagY, tw + 10, 20);
                    ctx.fillStyle = '#fff';
                    ctx.fillText(label, tagX + 5, Math.max(14, y - 7));
                });
            }

            renderAnnotationsPanel() {
                this.originCount.textContent = String(this.originalAnnotations.length);
                this.aiCount.textContent = String(this.aiAnnotations.length);
                if (this.counterTextBottom) {
                    this.counterTextBottom.textContent = String(this.originalAnnotations.length);
                }

                const avg = this.aiAnnotations.length
                    ? (this.aiAnnotations.reduce((sum, ann) => sum + Number(ann.confidence || 0), 0) / this.aiAnnotations.length)
                    : 0;
                this.avgConfidence.textContent = this.formatNumber(avg, 4);

                this.originList.innerHTML = this.originalAnnotations.length
                    ? this.originalAnnotations.map((ann, index) => this.makeResultRow(ann, index, false, this.selectedOriginIndex === index, 'origin')).join('')
                    : '<div class="result-empty">暂无原始标注</div>';

                this.aiList.innerHTML = this.aiAnnotations.length
                    ? this.aiAnnotations.map((ann, index) => this.makeResultRow(ann, index, true, this.selectedAiIndex === index, 'ai')).join('')
                    : '<div class="result-empty">暂无AI检测结果</div>';

                this.originList.querySelectorAll('[data-origin-index]').forEach((button) => {
                    button.addEventListener('click', () => {
                        this.selectedOriginIndex = Number(button.dataset.originIndex);
                        this.setViewMode('original');
                        this.renderAnnotationsPanel();
                        this.drawCurrentView();
                    });
                });

                this.aiList.querySelectorAll('[data-ai-index]').forEach((button) => {
                    button.addEventListener('click', () => {
                        this.selectedAiIndex = Number(button.dataset.aiIndex);
                        this.setViewMode('ai');
                        this.renderAnnotationsPanel();
                        this.drawCurrentView();
                    });
                });
            }

            makeResultRow(ann, index, showConfidence, isActive, rowType) {
                const conf = showConfidence ? this.formatNumber(ann.confidence, 4) : '-';
                const attrs = rowType === 'ai' ? `data-ai-index="${index}"` : `data-origin-index="${index}"`;
                const label = this.escapeHtml(ann.label || 'unknown');
                const color = this.getClassColor(ann.label || 'unknown');
                const hasPx = [ann.x_min_px, ann.y_min_px, ann.x_max_px, ann.y_max_px].every((v) => Number.isFinite(Number(v)));
                const bbox = hasPx
                    ? `[${this.formatNumber(ann.x_min_px, 2)}, ${this.formatNumber(ann.y_min_px, 2)}, ${this.formatNumber(ann.x_max_px, 2)}, ${this.formatNumber(ann.y_max_px, 2)}]`
                    : `[${this.formatNumber(ann.x_min, 4)}, ${this.formatNumber(ann.y_min, 4)}, ${this.formatNumber(ann.x_max, 4)}, ${this.formatNumber(ann.y_max, 4)}]`;
                const rowClass = isActive ? 'result-row active' : 'result-row';
                const checkedAttr = isActive ? 'checked' : '';
                const rowBg = this.hexToRgba(color, isActive ? 0.32 : 0.16);
                const rowFg = '#111827';
                return `<button class="${rowClass}" type="button" ${attrs} style="border-left:6px solid ${color}; border-color:${color}; background:${rowBg}; color:${rowFg};"><input class="result-checkbox" type="checkbox" ${checkedAttr} disabled><span class="result-index">${index + 1}</span><span class="result-main"><span class="result-class"><span class="result-dot" style="background:${color};"></span><span class="result-label">${label}</span></span><span class="result-bbox">坐标框: ${bbox}</span><span class="result-conf">置信度: ${conf}</span></span></button>`;
            }

            normalizeAnnotationList(rows, isAi) {
                return (rows || []).map((item, idx) => this.normalizeAnnotationItem(item, idx, isAi)).filter(Boolean);
            }

            normalizeAnnotationItem(item, index, isAi) {
                if (!item || typeof item !== 'object') {
                    return null;
                }

                const rawLabel = String(item.label ?? item.class_id ?? 'unknown').trim();
                let label = rawLabel || 'unknown';
                if (this.currentClassList.length > 0 && /^\d+$/.test(label)) {
                    const classId = Number(label);
                    if (classId >= 0 && classId < this.currentClassList.length) {
                        label = String(this.currentClassList[classId]);
                    }
                }
                label = this.normalizeLabelText(label);

                let xMin = Number(item.x_min);
                let yMin = Number(item.y_min);
                let xMax = Number(item.x_max);
                let yMax = Number(item.y_max);
                let xMinPx = Number(item.x_min_px);
                let yMinPx = Number(item.y_min_px);
                let xMaxPx = Number(item.x_max_px);
                let yMaxPx = Number(item.y_max_px);

                if ([xMin, yMin, xMax, yMax].some((n) => Number.isNaN(n))) {
                    return null;
                }

                const imageW = Number(this.currentImage && this.currentImage.width) || 0;
                const imageH = Number(this.currentImage && this.currentImage.height) || 0;

                const maybePixelCoords = Math.max(Math.abs(xMin), Math.abs(yMin), Math.abs(xMax), Math.abs(yMax)) > 1;
                if (maybePixelCoords && imageW > 0 && imageH > 0) {
                    xMinPx = xMin;
                    yMinPx = yMin;
                    xMaxPx = xMax;
                    yMaxPx = yMax;

                    const w = imageW || 1;
                    const h = imageH || 1;
                    xMin /= w;
                    xMax /= w;
                    yMin /= h;
                    yMax /= h;
                }

                xMin = Math.max(0, Math.min(1, xMin));
                yMin = Math.max(0, Math.min(1, yMin));
                xMax = Math.max(0, Math.min(1, xMax));
                yMax = Math.max(0, Math.min(1, yMax));

                if (xMax < xMin) {
                    const tmp = xMin;
                    xMin = xMax;
                    xMax = tmp;
                }
                if (yMax < yMin) {
                    const tmp = yMin;
                    yMin = yMax;
                    yMax = tmp;
                }

                if (!Number.isFinite(xMinPx) || !Number.isFinite(yMinPx) || !Number.isFinite(xMaxPx) || !Number.isFinite(yMaxPx)) {
                    if (imageW > 0 && imageH > 0) {
                        xMinPx = xMin * imageW;
                        xMaxPx = xMax * imageW;
                        yMinPx = yMin * imageH;
                        yMaxPx = yMax * imageH;
                    }
                }

                const confidenceRaw = Number(item.confidence);
                const confidence = Number.isNaN(confidenceRaw)
                    ? (isAi ? 0 : 1)
                    : Math.max(0, Math.min(1, confidenceRaw));

                return {
                    id: Number(item.id) || (index + 1),
                    label,
                    x_min: xMin,
                    y_min: yMin,
                    x_max: xMax,
                    y_max: yMax,
                    x_min_px: Number.isFinite(xMinPx) ? xMinPx : null,
                    y_min_px: Number.isFinite(yMinPx) ? yMinPx : null,
                    x_max_px: Number.isFinite(xMaxPx) ? xMaxPx : null,
                    y_max_px: Number.isFinite(yMaxPx) ? yMaxPx : null,
                    confidence,
                };
            }

            normalizeLabelText(rawLabel) {
                return String(rawLabel || '')
                    .normalize('NFKC')
                    .replace(/[\u200B-\u200D\uFEFF]/g, '')
                    .trim();
            }

            formatNumber(value, digits = 4) {
                const n = Number(value);
                if (Number.isNaN(n)) {
                    return '0';
                }
                const fixed = n.toFixed(digits);
                return fixed.replace(/\.0+$/, '').replace(/(\.\d*?[1-9])0+$/, '$1');
            }

            getClassColor(rawLabel) {
                const normalized = this.normalizeLabelText(rawLabel || 'unknown') || 'unknown';
                const key = normalized.toLowerCase().replace(/[\s_\-]+/g, '');
                if (this.classColorMap.has(key)) {
                    return this.classColorMap.get(key);
                }

                let hash = 0;
                for (let i = 0; i < key.length; i += 1) {
                    hash = ((hash << 5) - hash) + key.charCodeAt(i);
                    hash |= 0;
                }
                const color = this.classPalette[Math.abs(hash) % this.classPalette.length];
                this.classColorMap.set(key, color);
                return color;
            }

            hexToRgba(hex, alpha) {
                const normalized = String(hex || '').replace('#', '');
                if (normalized.length !== 6) {
                    return `rgba(37, 99, 235, ${alpha})`;
                }
                const r = parseInt(normalized.slice(0, 2), 16);
                const g = parseInt(normalized.slice(2, 4), 16);
                const b = parseInt(normalized.slice(4, 6), 16);
                return `rgba(${r}, ${g}, ${b}, ${alpha})`;
            }

            async saveAnnotations() {
                if (!this.currentImage) {
                    alert('请先选择图片');
                    return;
                }
                if (!this.aiAnnotations.length) {
                    alert('没有AI检测结果可保存');
                    return;
                }

                if (this.originalAnnotations.length > 0) {
                    const ok = window.confirm('当前图片已有标注文件，保存将覆盖原标注，是否继续？');
                    if (!ok) {
                        return;
                    }
                }

                const cleanRows = this.aiAnnotations.map((ann) => ({
                    label: ann.label,
                    x_min: ann.x_min,
                    y_min: ann.y_min,
                    x_max: ann.x_max,
                    y_max: ann.y_max,
                    confidence: ann.confidence
                }));

                const classes = Array.from(new Set(cleanRows.map((row) => String(row.label || '').trim()).filter(Boolean)));

                try {
                    await SeedAI.api.post(`/images/${this.currentImage.id}/label-file`, {
                        classes,
                        annotations: cleanRows
                    });
                    alert('保存成功，标注文件已覆盖并更新数据库路径');
                    this.originalAnnotations = cleanRows.map((row, idx) => Object.assign({ id: idx + 1, confidence: 1 }, row));
                    this.setViewMode('original');
                    this.renderAnnotationsPanel();
                    this.drawCurrentView();

                    const target = this.images.find((it) => Number(it.id) === Number(this.currentImage.id));
                    if (target) {
                        target.annotations_path = target.annotations_path || 'updated';
                    }
                    this.renderFileList();
                } catch (error) {
                    alert(error.message || '保存失败');
                }
            }

            exportResults() {
                if (!this.aiAnnotations.length) {
                    alert('没有AI结果可导出');
                    return;
                }

                const blob = new Blob([JSON.stringify(this.aiAnnotations, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `detection_${this.currentImage ? this.currentImage.id : Date.now()}.json`;
                link.click();
                URL.revokeObjectURL(url);
            }

            goRelative(step) {
                if (!this.filteredImages.length) {
                    return;
                }

                const next = this.currentImageIndex + step;
                if (next < 0 || next >= this.filteredImages.length) {
                    return;
                }
                const image = this.filteredImages[next];
                this.imageSelect.value = String(image.id);
                this.onImageSelect();
            }

            resetViewerState() {
                this.currentImageIndex = -1;
                this.currentImage = null;
                this.images = [];
                this.filteredImages = [];
                this.resetImageOnly();
                this.metaCount.textContent = '数据量: 0';
                this.metaAnnotated.textContent = '已标注: 0';
                this.metaDataset.textContent = '数据集: -';
            }

            resetImageOnly() {
                this.originalAnnotations = [];
                this.aiAnnotations = [];
                this.selectedOriginIndex = -1;
                this.selectedAiIndex = -1;
                this.detectBtn.disabled = true;
                this.saveBtn.disabled = true;
                this.exportBtn.disabled = true;
                this.prevBtn.disabled = true;
                this.nextBtn.disabled = true;
                this.modeText.textContent = '原始标注';
                this.originCount.textContent = '0';
                this.aiCount.textContent = '0';
                if (this.counterTextBottom) {
                    this.counterTextBottom.textContent = '0';
                }
                this.avgConfidence.textContent = '0%';
                if (this.detectStatus) {
                    this.detectStatus.textContent = '未执行';
                }
                this.originList.innerHTML = '<div class="result-empty">暂无原始标注</div>';
                this.aiList.innerHTML = '<div class="result-empty">暂无AI检测结果</div>';

                if (this.currentObjectUrl) {
                    URL.revokeObjectURL(this.currentObjectUrl);
                    this.currentObjectUrl = null;
                }
                this.viewerImage.style.display = 'none';
                this.viewerCanvas.style.display = 'none';
                this.viewerStage.style.display = 'none';
                this.placeholder.style.display = 'block';
                this.imageNaturalWidth = 0;
                this.imageNaturalHeight = 0;
                this.zoomLevel = 1;
                this.zoomValue.textContent = '100%';
                this.canvasWrap.scrollLeft = 0;
                this.canvasWrap.scrollTop = 0;
                this.canvasWrap.classList.remove('space-pan');
                this.canvasWrap.classList.remove('panning');
                const ctx = this.viewerCanvas.getContext('2d');
                ctx.clearRect(0, 0, this.viewerCanvas.width, this.viewerCanvas.height);
            }

            escapeHtml(value) {
                return String(value || '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.detectionWorkspace = new DetectionWorkspace();
        });
    </script>
</body>
</html>
