<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手工标注 - SeedAI</title>
    <link rel="stylesheet" href="style.css?v=20260308am">
</head>
<body>
    <main class="ann-app">
        <header class="header ann-page-header">
            <div class="container">
                <div class="header-content">
                    <div class="logo">
                        <h1>🌱 SeedAI</h1>
                        <span class="subtitle">AI图像标注平台</span>
                    </div>
                    <nav class="nav">
                        <ul>
                            <li><a href="index.html">首页</a></li>
                            <li><a href="spectrum.html">光谱分析</a></li>
                            <li><a href="detection.html">AI检测</a></li>
                            <li><a href="dataset.html">数据集</a></li>
                            <li><a href="annotate.html" class="active">手工标注</a></li>
                            <li><a href="javascript:void(0)" id="profileLink" style="display:none;">
                                <span id="usernameDisplay"></span>
                                <span id="logoutLink" style="cursor:pointer;margin-left:10px;">退出</span>
                            </a></li>
                            <li><a href="login.html" id="loginLink">登录</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </header>

        <section class="ann-topbar">
            <div class="ann-topbar-left">
                <strong id="annDatasetTitle">手工标注</strong>
                <span id="annStatusText">当前模式：编辑</span>
            </div>
            <div class="ann-topbar-right">
                <span>快捷键：上一张(A)，下一张(D)，矩形框(R)，空格+拖动平移</span>
            </div>
        </section>

        <section class="ann-layout">
            <aside class="ann-left-rail" id="annLeftPanel">
                <button class="ann-rail-btn ann-tool active" data-mode="bbox" title="目标框" type="button">▭</button>
                <button class="ann-rail-btn ann-tool" data-mode="classify" title="分类" type="button">◎</button>
                <button class="ann-rail-btn ann-tool" data-mode="edit" title="修改" type="button">✎</button>
                <button class="ann-rail-btn" id="annPrevBtn" title="上一张" type="button">←</button>
                <button class="ann-rail-btn" id="annNextBtn" title="下一张" type="button">→</button>
                <button class="ann-rail-btn" id="annSaveBtn" title="保存" type="button">✓</button>
                <button class="ann-rail-btn" id="annExitBtn" title="退出" type="button">✕</button>
                <div class="ann-zoom-readout" id="annZoomText">100%</div>
                <button class="ann-rail-btn" id="annZoomOut" title="缩小" type="button">-</button>
                <button class="ann-rail-btn" id="annZoomIn" title="放大" type="button">+</button>
                <button class="ann-rail-btn" id="annZoomReset" title="适配" type="button">⌂</button>

            </aside>

            <section class="ann-center-canvas">
                <div id="annCanvasWrap" class="ann-canvas-wrap">
                    <img id="annImage" alt="标注图片" style="display:none;">
                    <canvas id="annCanvas"></canvas>
                    <div id="annEmpty" class="ann-empty">暂无可标注图片</div>
                </div>
            </section>

            <aside class="ann-right-panel">
                <div class="ann-side-block">
                    <div class="ann-side-head">
                        <h5>类别</h5>
                        <button id="annAddCategoryBtn" class="btn btn-primary ann-add-category-inline" type="button">新增标签</button>
                    </div>
                    <!-- 类别列表 滑动 -->
                    <div id="annCategoryList" class="ann-scroll ann-label-block"></div>
                </div>

                <div class="ann-side-block">
                    <h5>标注</h5>
                    <select id="annLabelFilter" class="ann-filter" aria-label="标签筛选">
                        <option value="all">all</option>
                    </select>
                    <!-- 标注列表 滑动 -->
                    <div id="annLabelList" class="ann-scroll ann-label-block"></div>
                </div>

                <div class="ann-side-block">
                    <h5>文件</h5>
                    <input id="annFileSearch" class="ann-file-search" type="text" placeholder="搜索文件名">
                    <!-- 文件列表 滑动 得到数据集的所有文件数据 -->
                    <div id="annFileList" class="ann-scroll ann-file-block"></div>
                </div>
            </aside>
        </section>
    </main>

    <div id="annDatasetModal" class="modal" style="display:none;">
        <div class="modal-content dm-modal">
            <div class="modal-header">
                <h5>选择数据集</h5>
            </div>
            <div class="modal-body">
                <div id="annDatasetOptions" class="ann-scroll"></div>
            </div>
        </div>
    </div>

    <div id="annCategoryModal" class="modal" style="display:none;">
        <div class="modal-content dm-modal">
            <div class="modal-header">
                <h3 id="annCategoryModalTitle">选择类别</h3>
            </div>
            <div class="modal-body">
                <select id="annCategorySelect"></select>
                <div class="form-actions">
                    <button id="annCategoryConfirm" class="btn btn-primary" type="button">确认</button>
                    <button id="annCategoryCancel" class="btn btn-secondary" type="button">取消</button>
                </div>
            </div>
        </div>
    </div>

    <div id="annAddCategoryModal" class="modal" style="display:none;">
        <div class="modal-content dm-modal">
            <div class="modal-header">
                <h5>新增标签</h5>
            </div>
            <div class="modal-body">
                <input id="annAddCategoryInput" type="text" placeholder="请输入标签名称">
                <div class="form-actions">
                    <button id="annAddCategoryConfirm" class="btn btn-primary" type="button">确认</button>
                    <button id="annAddCategoryCancel" class="btn btn-secondary" type="button">取消</button>
                </div>
            </div>
        </div>
    </div>

    <div id="annContextMenu" class="ann-context-menu" style="display:none;">
        <button id="annCtxDelete" type="button">删除</button>
        <button id="annCtxChangeCategory" type="button">修改类别</button>
    </div>

    <script src="js/api-contract.js?v=20260308n"></script>
    <script src="js/shared.js?v=20260308m"></script>
    <script src="js/annotate.js?v=20260309aa"></script>
</body>
</html>
