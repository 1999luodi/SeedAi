<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图像标注 - SeedAI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <h1>🌱 SeedAI</h1>
                    <span class="subtitle">AI图像标注平台</span>
                </div>
                <nav class="nav">
                    <ul>
                        <li><a href="index.html">首页</a></li>
                        <li><a href="login.html" id="loginLink">登录</a></li>
                        <li><a href="dataset.html">数据集</a></li>
                        <li><a href="annotate.html" class="active">标注</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="page-header">
            <div class="container">
                <div class="page-header-content">
                    <h2>🎯 图像标注</h2>
                    <p id="datasetInfo">选择数据集开始标注</p>
                    <div class="page-actions">
                        <button class="btn btn-secondary" id="changeDatasetBtn">
                            <span class="btn-icon">📁</span>
                            切换数据集
                        </button>
                        <button class="btn btn-outline" id="autoLabelBtn">
                            <span class="btn-icon">🤖</span>
                            AI辅助标注
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="container">
            <!-- 标注工作区 -->
            <div class="annotation-workspace">
                <!-- 图像显示区域 -->
                <div class="image-section">
                    <div class="image-container">
                        <div class="image-toolbar">
                            <div class="zoom-controls">
                                <button class="btn-icon-btn" id="zoomOutBtn" title="缩小">🔍-</button>
                                <span id="zoomLevel">100%</span>
                                <button class="btn-icon-btn" id="zoomInBtn" title="放大">🔍+</button>
                                <button class="btn-icon-btn" id="fitToScreenBtn" title="适应屏幕">📐</button>
                            </div>
                            <div class="image-info">
                                <span id="imageCounter">0 / 0</span>
                                <span id="imageFilename">-</span>
                            </div>
                        </div>
                        <div class="image-viewport">
                            <img id="currentImage" src="" alt="标注图像" style="display: none;">
                            <div class="image-placeholder" id="imagePlaceholder">
                                <div class="placeholder-icon">🖼️</div>
                                <p>请选择数据集开始标注</p>
                            </div>
                        </div>
                    </div>

                    <!-- 导航控制 -->
                    <div class="navigation-controls">
                        <button class="btn btn-secondary" id="prevBtn" disabled>
                            <span class="btn-icon">⬅️</span>
                            上一张
                        </button>
                        <div class="progress-indicator">
                            <div class="progress-bar">
                                <div class="progress-fill" id="progressFill"></div>
                            </div>
                            <span id="progressText">0%</span>
                        </div>
                        <button class="btn btn-secondary" id="nextBtn" disabled>
                            下一张
                            <span class="btn-icon">➡️</span>
                        </button>
                    </div>
                </div>

                <!-- 标注工具面板 -->
                <div class="tools-panel">
                    <div class="tools-section">
                        <h3>📝 标签管理</h3>
                        <div class="label-input-group">
                            <input type="text" id="labelInput" placeholder="输入标签名称" maxlength="50">
                            <button class="btn btn-primary" id="addLabelBtn">
                                <span class="btn-icon">➕</span>
                                添加
                            </button>
                        </div>

                        <!-- 常用标签 -->
                        <div class="common-labels">
                            <h4>常用标签</h4>
                            <div class="label-tags" id="commonTags">
                                <span class="label-tag" data-label="person">person</span>
                                <span class="label-tag" data-label="car">car</span>
                                <span class="label-tag" data-label="dog">dog</span>
                                <span class="label-tag" data-label="cat">cat</span>
                                <span class="label-tag" data-label="tree">tree</span>
                                <span class="label-tag" data-label="building">building</span>
                            </div>
                        </div>

                        <!-- 当前标签列表 -->
                        <div class="current-labels">
                            <h4>当前标签</h4>
                            <div class="labels-list" id="labelsList">
                                <div class="empty-state">
                                    <p>暂无标签</p>
                                    <p>点击上方添加或选择常用标签</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="tools-section">
                        <h3>💾 操作</h3>
                        <div class="action-buttons">
                            <button class="btn btn-success" id="saveBtn" disabled>
                                <span class="btn-icon">💾</span>
                                保存标注
                            </button>
                            <button class="btn btn-outline" id="skipBtn" disabled>
                                <span class="btn-icon">⏭️</span>
                                跳过
                            </button>
                            <button class="btn btn-danger" id="clearLabelsBtn" disabled>
                                <span class="btn-icon">🗑️</span>
                                清空标签
                            </button>
                        </div>

                        <!-- 标注统计 -->
                        <div class="annotation-stats">
                            <h4>📊 标注统计</h4>
                            <div class="stats-grid">
                                <div class="stat-item">
                                    <span class="stat-label">已标注:</span>
                                    <span class="stat-value" id="annotatedCount">0</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">总图片:</span>
                                    <span class="stat-value" id="totalImages">0</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">完成率:</span>
                                    <span class="stat-value" id="completionRate">0%</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- AI 建议 -->
                    <div class="tools-section ai-suggestions" id="aiSuggestions" style="display: none;">
                        <h3>🤖 AI 建议标签</h3>
                        <div class="ai-tags" id="aiTags">
                            <div class="loading">正在分析图像...</div>
                        </div>
                        <div class="ai-confidence">
                            <small>AI 建议基于图像内容分析，结果仅供参考</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 数据集选择模态框 -->
    <div class="modal" id="datasetModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>选择数据集</h3>
                <button class="modal-close" id="closeDatasetModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="dataset-selector" id="datasetSelector">
                    <div class="loading">加载数据集中...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/annotate.js"></script>
</body>
</html>
