<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeedAI - 登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            color: #333;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }

        .login-header p {
            color: #666;
            font-size: 1rem;
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 600;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .error-message {
            color: #e74c3c;
            text-align: center;
            margin-top: 1rem;
            padding: 10px;
            background: #fdf2f2;
            border-radius: 4px;
            display: none;
        }

        .success-message {
            color: #27ae60;
            text-align: center;
            margin-top: 1rem;
            padding: 10px;
            background: #f2fdf5;
            border-radius: 4px;
            display: none;
        }

        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: #666;
            font-size: 0.9rem;
        }

        .login-footer a {
            color: #667eea;
            text-decoration: none;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }
        
        .credentials-info {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 6px;
            font-size: 0.85rem;
        }
        
        .credential-item {
            margin: 0.3rem 0;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo">🌱</div>
            <h1>SeedAI 后台登录</h1>
            <p>AI图像标注与数据集后台管理平台</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">用户名或邮箱</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>

            <button type="submit">登录</button>
        </form>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <div class="credentials-info">
            <p><strong>默认账户信息:</strong></p>
            <p class="credential-item"><strong>超级管理员:</strong> admin / 123456</p>
            <p class="credential-item"><strong>普通用户:</strong> user1 / 123456</p>
            <p class="credential-item"><strong>管理后台:</strong> 角色 ≥ 1 可访问</p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            
            // 隐藏之前的消息
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            
            try {
                // 使用后端专用的登录接口，该接口会检查用户是否有管理权限
                const response = await fetch('/backend/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username_or_email: username,
                        password: password
                    })
                });
                
                const result = await response.json();
                
                if(response.ok && result.success) {
                    // 保存token到localStorage
                    const token = result.data.token;
                    localStorage.setItem('token', token);
                    
                    // 获取用户角色
                    const userRole = result.data.user.role;
                    
                    if(userRole >= 1) {
                        // 先调用API将token设置到session中
                        const sessionResponse = await fetch('/backend/set-session-token', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`
                            }
                        });
                        
                        if(sessionResponse.ok) {
                            // 设置session成功，跳转到管理后台
                            window.location.href = '/backend/admin';
                        } else {
                            // 设置session失败，仍然跳转，因为前端JS会处理后续请求
                            window.location.href = '/backend/admin';
                        }
                    } else {
                        // 普通用户不应该能到达这里，因为后端登录接口会检查权限
                        errorMessage.textContent = '您没有权限访问后端管理系统';
                        errorMessage.style.display = 'block';
                    }
                    
                    successMessage.textContent = '登录成功，正在跳转...';
                    successMessage.style.display = 'block';
                } else {
                    errorMessage.textContent = result.message || '登录失败，请检查用户名和密码';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = '网络错误或服务器未响应，请检查服务是否正常运行';
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
