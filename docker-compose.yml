services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: ai_dataset
    volumes:
      - D:/ai-porjects/SeedAi/mysql_data:/var/lib/mysql
    restart: unless-stopped

  backend:
    image: python:3.9-slim
    working_dir: /app
    volumes:
      - D:/ai-projects/SeedAi/backend:/app
      - D:/ai-projects/SeedAi/uploads:/app/uploads
      - D:/ai-projects/SeedAi/datasets:/app/datasets
    ports:
      - "5000:5000"
    command: bash -c "pip install -r requirements.txt && python app.py"
    environment:
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=rootpass
      - DB_NAME=ai_dataset
      - MODEL_PATH=/app/pytorch_model/weights/yolov5s.pt
    depends_on:
      - mysql
    restart: unless-stopped

  ai_worker:
    image: pytorch/pytorch:2.0.1-cuda11.7-cudnn8-runtime
    volumes:
      - D:/ai-projects/SeedAi/pytorch_model:/workspace
      - D:/ai-projects/SeedAi/uploads:/workspace/uploads
    command: python /workspace/inference.py
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - D:/ai-projects/SeedAi/frontend:/usr/share/nginx/html
      - D:/ai-projects/SeedAi/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    restart: unless-stopped
